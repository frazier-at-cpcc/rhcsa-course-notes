<svg viewBox="0 0 760 178" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Password aging timeline: minimum days, free period, warning period, inactive period, then locked; account expiration is a separate fixed date">
<g font-size="9.5" font-weight="700" fill="#5c4a30" text-anchor="middle">
<text x="40" y="22">Day 0</text><text x="40" y="34" class="mono" fill="#6d28d9">chage -d</text>
<text x="150" y="22">Day 7</text><text x="150" y="34" class="mono" fill="#6d28d9">-m 7</text>
<text x="420" y="22">Day 76</text><text x="420" y="34" class="mono" fill="#6d28d9">-W 14</text>
<text x="540" y="22">Day 90</text><text x="540" y="34" class="mono" fill="#6d28d9">-M 90</text>
<text x="650" y="22">Day 90 + N</text><text x="650" y="34" class="mono" fill="#6d28d9">-I N</text>
</g>
<g stroke="#1a1209" stroke-width="1.5">
<path d="M40 38V48M150 38V48M420 38V48M540 38V48M650 38V48"/>
</g>
<rect x="42.5" y="52.5" width="680" height="46" rx="7" fill="#1a1209"/>
<rect x="40" y="50" width="680" height="46" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
<path d="M47 51H150V95H47A6 6 0 0 1 41 89V57A6 6 0 0 1 47 51Z" fill="#efe6ff"/>
<rect x="420" y="51" width="120" height="44" fill="#ffd60a"/>
<rect x="540" y="51" width="110" height="44" fill="#c4b3ff"/>
<path d="M650 51H713A6 6 0 0 1 719 57V89A6 6 0 0 1 713 95H650Z" fill="#1a1209"/>
<rect x="40" y="50" width="680" height="46" rx="7" fill="none" stroke="#1a1209" stroke-width="2"/>
<g stroke="#1a1209" stroke-width="2"><path d="M150 50V96M420 50V96M540 50V96M650 50V96"/></g>
<g text-anchor="middle" font-weight="800" font-size="11.5" fill="#1a1209">
<text x="95" y="70">Too soon</text>
<text x="285" y="70">Normal use</text>
<text x="480" y="70">Warned</text>
<text x="595" y="70">Expired</text>
<text x="685" y="70" fill="#fff">Locked</text>
</g>
<g text-anchor="middle" font-weight="600" font-size="9" fill="#5c4a30">
<text x="95" y="85">user cannot change</text>
<text x="285" y="85">user may change any time</text>
<text x="480" y="85">notice at each login</text>
<text x="595" y="85">must change to log in</text>
<text x="685" y="85" fill="#efe6ff">admin resets</text>
</g>
<path d="M40 136H720" stroke="#d8d2c8" stroke-width="2"/>
<rect x="602.5" y="125.5" width="20" height="20" rx="4" fill="#1a1209"/>
<rect x="600" y="123" width="20" height="20" rx="4" fill="#9a3412" stroke="#1a1209" stroke-width="2"/>
<text x="40" y="128" font-size="10.5" font-weight="800" fill="#1a1209">ACCOUNT EXPIRATION</text>
<text x="40" y="153" font-size="9.5" font-weight="600" fill="#5c4a30">A fixed calendar date, separate from the password clock. On that date the account</text>
<text x="40" y="166" font-size="9.5" font-weight="600" fill="#5c4a30">refuses every login, whatever the password says.</text>
<text x="590" y="129" text-anchor="end" font-size="10" font-weight="700" fill="#9a3412" class="mono">chage -E 2026-12-31</text>
</svg>
