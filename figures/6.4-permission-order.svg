<svg viewBox="0 0 760 286" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Access is checked in order: x on every parent directory, file attributes, then owner, named user, group, or other entries limited by the ACL mask, then SELinux. Any refusal ends the check.">
  <defs>
    <marker id="po-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1a1209"/></marker>
    <marker id="po-rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a3412"/></marker>
  </defs>
  <!-- stage boxes -->
  <g>
    <rect x="12.5" y="14.5" width="138" height="168" rx="7" fill="#1a1209"/>
    <rect x="10" y="12" width="138" height="168" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
    <rect x="178.5" y="14.5" width="138" height="168" rx="7" fill="#1a1209"/>
    <rect x="176" y="12" width="138" height="168" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
    <rect x="344.5" y="14.5" width="242" height="168" rx="7" fill="#1a1209"/>
    <rect x="342" y="12" width="242" height="168" rx="7" fill="#efe6ff" stroke="#1a1209" stroke-width="2"/>
    <rect x="614.5" y="14.5" width="138" height="168" rx="7" fill="#1a1209"/>
    <rect x="612" y="12" width="138" height="168" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
  </g>
  <!-- stage titles -->
  <g font-size="12.5" font-weight="800" fill="#1a1209" text-anchor="middle">
    <text x="79" y="34">1  Path</text>
    <text x="245" y="34">2  Attributes</text>
    <text x="463" y="34">3  Mode bits and ACL</text>
    <text x="681" y="34">4  SELinux</text>
  </g>
  <g stroke="#d8d2c8" stroke-width="1.5">
    <path d="M22 44H136"/>
    <path d="M188 44H302"/>
    <path d="M354 44H572"/>
    <path d="M624 44H738"/>
  </g>
  <!-- stage 1 text -->
  <g font-size="10.5" font-weight="600" fill="#1a1209" text-anchor="middle">
    <text x="79" y="66">x on every</text>
    <text x="79" y="81">parent directory</text>
    <text x="79" y="104" fill="#5c4a30" font-size="10">each directory is</text>
    <text x="79" y="118" fill="#5c4a30" font-size="10">checked by steps 3-4</text>
    <text x="245" y="66">immutable (+i)</text>
    <text x="245" y="81">refuses any change,</text>
    <text x="245" y="96">even from root</text>
    <text x="245" y="118" fill="#5c4a30" font-size="10">append-only (+a)</text>
    <text x="245" y="132" fill="#5c4a30" font-size="10">allows only &gt;&gt;</text>
    <text x="681" y="66">the process type</text>
    <text x="681" y="81">must be allowed</text>
    <text x="681" y="96">to the file type</text>
    <text x="681" y="118" fill="#5c4a30" font-size="10">httpd_t to var_t:</text>
    <text x="681" y="132" fill="#5c4a30" font-size="10">denied, any mode</text>
  </g>
  <!-- stage 3 rows: first match wins -->
  <text x="463" y="60" text-anchor="middle" font-size="10" font-weight="700" fill="#5c4a30">first match wins</text>
  <g>
    <rect x="352" y="67" width="222" height="22" rx="4" fill="#fff" stroke="#c4b3ff" stroke-width="1.5"/>
    <rect x="352" y="93" width="222" height="22" rx="4" fill="#fffae0" stroke="#c4b3ff" stroke-width="1.5"/>
    <rect x="352" y="119" width="222" height="22" rx="4" fill="#fffae0" stroke="#c4b3ff" stroke-width="1.5"/>
    <rect x="352" y="145" width="222" height="22" rx="4" fill="#fff" stroke="#c4b3ff" stroke-width="1.5"/>
  </g>
  <g font-size="10.5" font-weight="700" fill="#1a1209">
    <text x="360" y="82">owner</text>
    <text x="360" y="108">named user</text>
    <text x="360" y="134">group, named groups</text>
    <text x="360" y="160">other</text>
  </g>
  <g font-size="10" font-weight="600" fill="#3a1d70" text-anchor="end">
    <text x="566" y="82">user:: bits</text>
    <text x="566" y="108">entry AND mask</text>
    <text x="566" y="134">entry AND mask</text>
    <text x="566" y="160">other:: bits</text>
  </g>
  <!-- tool names -->
  <g class="mono" font-size="10" font-weight="600" fill="#6d28d9" text-anchor="middle">
    <text x="79" y="166">namei -l</text>
    <text x="245" y="166">lsattr</text>
    <text x="681" y="166">ls -Z</text>
  </g>
  <!-- pass arrows -->
  <g stroke="#1a1209" stroke-width="2" fill="none" marker-end="url(#po-ink)">
    <path d="M150 96H170"/>
    <path d="M316 96H336"/>
    <path d="M586 96H606"/>
  </g>
  <!-- refuse arrows -->
  <g stroke="#9a3412" stroke-width="2" fill="none" marker-end="url(#po-rust)">
    <path d="M79 182V224"/>
    <path d="M245 182V224"/>
    <path d="M463 182V224"/>
    <path d="M640 182C640 206 600 214 572 228"/>
  </g>
  <g font-size="9.5" font-weight="800" fill="#9a3412">
    <text x="85" y="206">no</text>
    <text x="251" y="206">no</text>
    <text x="469" y="206">no</text>
    <text x="648" y="206">no</text>
  </g>
  <!-- outcome bars -->
  <rect x="12.5" y="234.5" width="560" height="44" rx="7" fill="#1a1209"/>
  <rect x="10" y="232" width="560" height="44" rx="7" fill="#fffae0" stroke="#1a1209" stroke-width="2"/>
  <text x="290" y="250" text-anchor="middle" font-size="11" font-weight="800" fill="#9a3412">Refused, and no later step can restore access</text>
  <text x="290" y="266" text-anchor="middle" font-size="10" font-weight="600" fill="#5c4a30">steps 1, 3, 4: Permission denied.  Step 2: Operation not permitted</text>
  <path d="M720 182V224" stroke="#1a1209" stroke-width="2" fill="none" marker-end="url(#po-ink)"/>
  <text x="726" y="206" font-size="9.5" font-weight="800" fill="#1a1209">yes</text>
  <rect x="616.5" y="234.5" width="134" height="44" rx="7" fill="#1a1209"/>
  <rect x="614" y="232" width="134" height="44" rx="7" fill="#6d28d9" stroke="#1a1209" stroke-width="2"/>
  <text x="681" y="259" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">Allowed</text>
</svg>
