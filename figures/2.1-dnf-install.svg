<svg viewBox="0 0 760 196" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="What dnf install does: read repo files, fetch repodata, resolve dependencies, check signatures, then rpm installs and records the package in the RPM database that rpm -q queries">
<defs><marker id="dn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1a1209"/></marker></defs>
<g text-anchor="middle">
<rect x="8.5" y="22.5" width="108" height="62" rx="7" fill="#1a1209"/><rect x="6" y="20" width="108" height="62" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
<text x="60" y="47" font-size="11.5" font-weight="800" fill="#1a1209" class="mono">dnf install</text>
<text x="60" y="63" font-size="9" font-weight="600" fill="#5c4a30">you name a package</text>
<rect x="134.5" y="22.5" width="108" height="62" rx="7" fill="#1a1209"/><rect x="132" y="20" width="108" height="62" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
<text x="186" y="47" font-size="12" font-weight="800" fill="#1a1209">.repo files</text>
<text x="186" y="63" font-size="9" font-weight="600" fill="#5c4a30" class="mono">/etc/yum.repos.d</text>
<rect x="260.5" y="22.5" width="108" height="62" rx="7" fill="#1a1209"/><rect x="258" y="20" width="108" height="62" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
<text x="312" y="47" font-size="12" font-weight="800" fill="#1a1209">repodata/</text>
<text x="312" y="63" font-size="9" font-weight="600" fill="#5c4a30">fetched from baseurl</text>
<rect x="386.5" y="22.5" width="108" height="62" rx="7" fill="#1a1209"/><rect x="384" y="20" width="108" height="62" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
<text x="438" y="47" font-size="12" font-weight="800" fill="#1a1209">Resolve</text>
<text x="438" y="63" font-size="9" font-weight="600" fill="#5c4a30">add dependencies</text>
<rect x="512.5" y="22.5" width="108" height="62" rx="7" fill="#1a1209"/><rect x="510" y="20" width="108" height="62" rx="7" fill="#ffd60a" stroke="#1a1209" stroke-width="2"/>
<text x="564" y="47" font-size="12" font-weight="800" fill="#1a1209">GPG check</text>
<text x="564" y="63" font-size="9" font-weight="700" fill="#1a1209" class="mono">gpgcheck, gpgkey</text>
<rect x="638.5" y="22.5" width="108" height="62" rx="7" fill="#1a1209"/><rect x="636" y="20" width="108" height="62" rx="7" fill="#6d28d9" stroke="#1a1209" stroke-width="2"/>
<text x="690" y="47" font-size="12" font-weight="800" fill="#fff">rpm installs</text>
<text x="690" y="63" font-size="9" font-weight="700" fill="#efe6ff">files and scripts</text>
<text x="564" y="102" font-size="9" font-weight="700" fill="#9a3412">unsigned or wrong key:</text>
<text x="564" y="114" font-size="9" font-weight="800" fill="#9a3412">GPG check FAILED</text>
<rect x="626.5" y="130.5" width="120" height="54" rx="7" fill="#1a1209"/><rect x="624" y="128" width="120" height="54" rx="7" fill="#efe6ff" stroke="#1a1209" stroke-width="2"/>
<text x="684" y="151" font-size="12" font-weight="800" fill="#1a1209">RPM database</text>
<text x="684" y="167" font-size="8.5" font-weight="600" fill="#5c4a30" class="mono">/usr/lib/sysimage/rpm</text>
<rect x="386.5" y="130.5" width="214" height="54" rx="7" fill="#1a1209"/><rect x="384" y="128" width="214" height="54" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
<text x="491" y="151" font-size="11" font-weight="800" fill="#1a1209" class="mono">rpm -q -qa -qi -ql -qf</text>
<text x="491" y="167" font-size="9" font-weight="600" fill="#5c4a30">reads only the local database</text>
</g>
<g stroke="#1a1209" stroke-width="2" marker-end="url(#dn)">
<path d="M114 51H130"/>
<path d="M240 51H256"/>
<path d="M366 51H382"/>
<path d="M492 51H508"/>
<path d="M618 51H634"/>
<path d="M690 82V126"/>
<path d="M598 155H622"/>
</g>
<path d="M132 92V99H366V92" fill="none" stroke="#1a1209" stroke-width="1.5"/>
<text x="249" y="114" text-anchor="middle" font-size="9.5" font-weight="800" fill="#1a1209">READ ON EVERY RUN <tspan font-weight="600" fill="#5c4a30">so a saved .repo file persists</tspan></text>
</svg>
