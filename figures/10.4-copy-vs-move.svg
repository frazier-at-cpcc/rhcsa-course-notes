<svg viewBox="0 0 360 226" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="cp into /var/www/html creates a new file labeled httpd_sys_content_t; mv keeps the original user_home_t label">
  <defs>
    <marker id="cm-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1a1209"/></marker>
    <marker id="cm-rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a3412"/></marker>
  </defs>
  <!-- destination directory -->
  <rect x="177.5" y="14.5" width="170" height="200" rx="7" fill="#1a1209"/>
  <rect x="175" y="12" width="170" height="200" rx="7" fill="#efe6ff" stroke="#1a1209" stroke-width="2"/>
  <text x="260" y="31" text-anchor="middle" font-size="12" font-weight="800" fill="#1a1209" class="mono">/var/www/html/</text>
  <text x="260" y="46" text-anchor="middle" font-size="9.5" font-weight="600" fill="#5c4a30">new files here get</text>
  <text x="260" y="58" text-anchor="middle" font-size="9.5" font-weight="600" fill="#5c4a30" class="mono">httpd_sys_content_t</text>

  <!-- source file -->
  <rect x="14.5" y="80.5" width="122" height="68" rx="7" fill="#1a1209"/>
  <rect x="12" y="78" width="122" height="68" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
  <text x="73" y="99" text-anchor="middle" font-size="11" font-weight="800" fill="#1a1209" class="mono">~/notes.txt</text>
  <text x="73" y="116" text-anchor="middle" font-size="10" font-weight="600" fill="#1a1209" class="mono">user_home_t</text>
  <text x="73" y="134" text-anchor="middle" font-size="9.5" font-weight="600" fill="#5c4a30">in a home directory</text>

  <!-- copy result -->
  <rect x="190.5" y="76.5" width="142" height="52" rx="7" fill="#1a1209"/>
  <rect x="188" y="74" width="142" height="52" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
  <text x="259" y="94" text-anchor="middle" font-size="11" font-weight="800" fill="#1a1209" class="mono">notes.txt</text>
  <text x="259" y="111" text-anchor="middle" font-size="10" font-weight="600" fill="#6d28d9" class="mono">httpd_sys_content_t</text>

  <!-- move result -->
  <rect x="190.5" y="148.5" width="142" height="52" rx="7" fill="#1a1209"/>
  <rect x="188" y="146" width="142" height="52" rx="7" fill="#fffae0" stroke="#1a1209" stroke-width="2"/>
  <text x="259" y="166" text-anchor="middle" font-size="11" font-weight="800" fill="#1a1209" class="mono">moved.txt</text>
  <text x="259" y="183" text-anchor="middle" font-size="10" font-weight="600" fill="#9a3412" class="mono">user_home_t</text>

  <!-- arrows -->
  <path d="M135 98C160 98 160 100 182 100" stroke="#1a1209" stroke-width="2" fill="none" marker-end="url(#cm-ink)"/>
  <path d="M135 128C160 128 160 172 182 172" stroke="#9a3412" stroke-width="2" fill="none" marker-end="url(#cm-rust)"/>
  <text x="158" y="91" text-anchor="middle" font-size="11" font-weight="800" fill="#1a1209" class="mono">cp</text>
  <text x="152" y="166" text-anchor="middle" font-size="11" font-weight="800" fill="#9a3412" class="mono">mv</text>

  <!-- notes -->
  <text x="12" y="186" font-size="9.5" font-weight="700" fill="#1a1209">cp: new inode, new label</text>
  <text x="12" y="201" font-size="9.5" font-weight="700" fill="#9a3412">mv: same inode, same label</text>
</svg>
