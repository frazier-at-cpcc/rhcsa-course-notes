<svg viewBox="0 0 360 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Applications follow the hosts line in nsswitch.conf: /etc/hosts first, then DNS, then the machine's own name. host and dig go straight to DNS.">
  <defs>
    <marker id="lo-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1a1209"/></marker>
    <marker id="lo-rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a3412"/></marker>
  </defs>
  <!-- callers -->
  <rect x="15" y="15" width="200" height="40" rx="7" fill="#1a1209"/>
  <rect x="12" y="12" width="200" height="40" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
  <text x="112" y="37" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1209" class="mono">getent, ping, ssh, curl</text>
  <rect x="245" y="15" width="103" height="40" rx="7" fill="#1a1209"/>
  <rect x="242" y="12" width="103" height="40" rx="7" fill="#fffae0" stroke="#1a1209" stroke-width="2"/>
  <text x="293" y="37" text-anchor="middle" font-size="11" font-weight="700" fill="#9a3412" class="mono">host, dig</text>
  <!-- into the chain -->
  <path d="M112 53V82" stroke="#1a1209" stroke-width="2" fill="none" marker-end="url(#lo-ink)"/>
  <text x="122" y="72" font-size="9.5" font-weight="700" fill="#5c4a30"><tspan class="mono">hosts:</tspan> line, in order</text>
  <!-- 1 files -->
  <rect x="15" y="93" width="200" height="46" rx="7" fill="#1a1209"/>
  <rect x="12" y="90" width="200" height="46" rx="7" fill="#efe6ff" stroke="#1a1209" stroke-width="2"/>
  <text x="26" y="109" font-size="11" font-weight="800" fill="#6d28d9">1</text>
  <text x="40" y="109" font-size="11" font-weight="700" fill="#1a1209"><tspan class="mono">files</tspan>: /etc/hosts</text>
  <text x="40" y="126" font-size="9.5" font-weight="600" fill="#5c4a30">a match here ends the lookup</text>
  <path d="M112 137V166" stroke="#1a1209" stroke-width="2" fill="none" marker-end="url(#lo-ink)"/>
  <text x="122" y="156" font-size="9.5" font-weight="800" fill="#1a1209">not found</text>
  <!-- 2 dns -->
  <rect x="15" y="177" width="200" height="46" rx="7" fill="#1a1209"/>
  <rect x="12" y="174" width="200" height="46" rx="7" fill="#efe6ff" stroke="#1a1209" stroke-width="2"/>
  <text x="26" y="193" font-size="11" font-weight="800" fill="#6d28d9">2</text>
  <text x="40" y="193" font-size="11" font-weight="700" fill="#1a1209" class="mono">dns</text>
  <text x="40" y="210" font-size="9.5" font-weight="600" fill="#5c4a30">servers in /etc/resolv.conf</text>
  <path d="M112 221V250" stroke="#1a1209" stroke-width="2" fill="none" marker-end="url(#lo-ink)"/>
  <text x="122" y="240" font-size="9.5" font-weight="800" fill="#1a1209">not found</text>
  <!-- 3 myhostname -->
  <rect x="15" y="261" width="200" height="34" rx="7" fill="#1a1209"/>
  <rect x="12" y="258" width="200" height="34" rx="7" fill="#efe6ff" stroke="#1a1209" stroke-width="2"/>
  <text x="26" y="279" font-size="11" font-weight="800" fill="#6d28d9">3</text>
  <text x="40" y="279" font-size="11" font-weight="700" fill="#1a1209"><tspan class="mono">myhostname</tspan>: own name</text>
  <!-- host/dig bypass -->
  <path d="M293 53V197H222" stroke="#9a3412" stroke-width="2" stroke-dasharray="5 3" fill="none" marker-end="url(#lo-rust)"/>
  <text x="300" y="112" font-size="9.5" font-weight="700" fill="#9a3412">skip</text>
  <text x="300" y="125" font-size="9.5" font-weight="700" fill="#9a3412">/etc/hosts</text>
</svg>
