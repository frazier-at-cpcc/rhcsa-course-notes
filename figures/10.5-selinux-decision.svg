<svg viewBox="0 0 760 312" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SELinux takes the process domain, the target type, and the action, checks the policy for an allow rule, then for a Boolean that enables one, and in enforcing mode denies and logs an AVC record">
  <defs>
    <marker id="sd-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1a1209"/></marker>
    <marker id="sd-rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a3412"/></marker>
    <marker id="sd-pur" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6d28d9"/></marker>
  </defs>

  <!-- the three inputs -->
  <g>
    <rect x="14.5" y="14.5" width="226" height="64" rx="7" fill="#1a1209"/>
    <rect x="12" y="12" width="226" height="64" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
    <rect x="269.5" y="14.5" width="226" height="64" rx="7" fill="#1a1209"/>
    <rect x="267" y="12" width="226" height="64" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
    <rect x="524.5" y="14.5" width="226" height="64" rx="7" fill="#1a1209"/>
    <rect x="522" y="12" width="226" height="64" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
  </g>
  <g font-size="11.5" font-weight="800" fill="#1a1209" text-anchor="middle">
    <text x="125" y="31">Source: process domain</text>
    <text x="380" y="31">Target: object type</text>
    <text x="635" y="31">Action: class and permission</text>
  </g>
  <g font-size="10.5" font-weight="700" fill="#6d28d9" text-anchor="middle" class="mono">
    <text x="125" y="49">httpd_t</text>
    <text x="380" y="49">default_t, http_port_t</text>
    <text x="635" y="49">file read, tcp_socket name_bind</text>
  </g>
  <g font-size="9.5" font-weight="600" fill="#5c4a30" text-anchor="middle">
    <text x="125" y="66">see it with ps -eZ</text>
    <text x="380" y="66">ls -Z, semanage port -l</text>
    <text x="635" y="66">named in the AVC record</text>
  </g>

  <!-- into the policy -->
  <g stroke="#1a1209" stroke-width="2" fill="none" marker-end="url(#sd-ink)">
    <path d="M125 78V96"/>
    <path d="M380 78V96"/>
    <path d="M635 78V96"/>
  </g>
  <rect x="14.5" y="104.5" width="736" height="28" rx="7" fill="#1a1209"/>
  <rect x="12" y="102" width="736" height="28" rx="7" fill="#6d28d9" stroke="#1a1209" stroke-width="2"/>
  <text x="380" y="120" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">rwx permissions already passed; SELinux now checks the loaded targeted policy</text>
  <path d="M125 130V152" stroke="#1a1209" stroke-width="2" fill="none" marker-end="url(#sd-ink)"/>

  <!-- decisions -->
  <g>
    <rect x="14.5" y="162.5" width="226" height="62" rx="7" fill="#1a1209"/>
    <rect x="12" y="160" width="226" height="62" rx="7" fill="#efe6ff" stroke="#1a1209" stroke-width="2"/>
    <rect x="269.5" y="162.5" width="226" height="62" rx="7" fill="#1a1209"/>
    <rect x="267" y="160" width="226" height="62" rx="7" fill="#efe6ff" stroke="#1a1209" stroke-width="2"/>
    <rect x="524.5" y="162.5" width="226" height="62" rx="7" fill="#1a1209"/>
    <rect x="522" y="160" width="226" height="62" rx="7" fill="#efe6ff" stroke="#1a1209" stroke-width="2"/>
  </g>
  <g font-size="11" font-weight="800" fill="#1a1209" text-anchor="middle">
    <text x="125" y="178">Does a rule allow this</text>
    <text x="125" y="193">domain, type, and action?</text>
    <text x="380" y="178">Is a Boolean that adds</text>
    <text x="380" y="193">such a rule switched on?</text>
    <text x="635" y="185">Is SELinux enforcing?</text>
  </g>
  <g font-size="9.5" font-weight="600" fill="#5c4a30" text-anchor="middle">
    <text x="125" y="211">wrong type? fix the label</text>
    <text x="380" y="211">fix: setsebool -P</text>
    <text x="635" y="205">check: getenforce</text>
  </g>

  <!-- no arrows between decisions -->
  <g stroke="#1a1209" stroke-width="2" fill="none" marker-end="url(#sd-ink)">
    <path d="M238 191H259"/>
    <path d="M493 191H514"/>
  </g>
  <g font-size="9.5" font-weight="800" fill="#1a1209" text-anchor="middle">
    <text x="252" y="184">no</text>
    <text x="507" y="184">no</text>
  </g>

  <!-- outcomes -->
  <g stroke="#6d28d9" stroke-width="2" fill="none" marker-end="url(#sd-pur)">
    <path d="M125 222V250"/>
    <path d="M380 222V250"/>
    <path d="M560 222V250"/>
  </g>
  <path d="M700 222V250" stroke="#9a3412" stroke-width="2" fill="none" marker-end="url(#sd-rust)"/>
  <g font-size="9.5" font-weight="800" text-anchor="start">
    <text x="131" y="240" fill="#1a1209">yes</text>
    <text x="386" y="240" fill="#1a1209">yes</text>
    <text x="566" y="240" fill="#1a1209">no (permissive)</text>
    <text x="706" y="240" fill="#9a3412">yes</text>
  </g>

  <rect x="14.5" y="260.5" width="586" height="44" rx="7" fill="#1a1209"/>
  <rect x="12" y="258" width="586" height="44" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
  <text x="305" y="276" text-anchor="middle" font-size="11.5" font-weight="800" fill="#1a1209">Allowed</text>
  <text x="305" y="292" text-anchor="middle" font-size="9.5" font-weight="600" fill="#5c4a30">in permissive mode the would-be denial is still written to audit.log</text>

  <rect x="626.5" y="260.5" width="124" height="44" rx="7" fill="#1a1209"/>
  <rect x="624" y="258" width="124" height="44" rx="7" fill="#fffae0" stroke="#1a1209" stroke-width="2"/>
  <text x="686" y="276" text-anchor="middle" font-size="11.5" font-weight="800" fill="#9a3412">Denied</text>
  <text x="686" y="292" text-anchor="middle" font-size="9.5" font-weight="600" fill="#5c4a30">AVC in audit.log</text>
</svg>
