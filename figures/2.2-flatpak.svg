<svg viewBox="0 0 760 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Flatpak remotes feed a system or a user installation; flatpak run starts an app on top of its runtime in a sandbox">
<defs><marker id="fp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1a1209"/></marker></defs>
<text x="90" y="12" text-anchor="middle" font-size="9.5" font-weight="800" fill="#5c4a30">REMOTES</text>
<text x="405" y="12" text-anchor="middle" font-size="9.5" font-weight="800" fill="#5c4a30">INSTALLATIONS</text>
<g text-anchor="middle">
<rect x="8.5" y="22.5" width="164" height="72" rx="7" fill="#1a1209"/><rect x="6" y="20" width="164" height="72" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
<text x="88" y="43" font-size="12" font-weight="800" fill="#1a1209" class="mono">flathub</text>
<text x="88" y="60" font-size="9" font-weight="600" fill="#5c4a30" class="mono">dl.flathub.org</text>
<text x="88" y="78" font-size="9" font-weight="600" fill="#5c4a30">community apps, open to all</text>
<rect x="8.5" y="112.5" width="164" height="72" rx="7" fill="#1a1209"/><rect x="6" y="110" width="164" height="72" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
<text x="88" y="133" font-size="12" font-weight="800" fill="#1a1209" class="mono">rhel</text>
<text x="88" y="150" font-size="9" font-weight="600" fill="#5c4a30" class="mono">flatpaks.redhat.io</text>
<text x="88" y="168" font-size="9" font-weight="700" fill="#9a3412">installs need a subscription</text>
<rect x="272.5" y="22.5" width="264" height="72" rx="7" fill="#1a1209"/><rect x="270" y="20" width="264" height="72" rx="7" fill="#efe6ff" stroke="#1a1209" stroke-width="2"/>
<text x="402" y="40" font-size="12" font-weight="800" fill="#1a1209">System installation</text>
<text x="402" y="56" font-size="9" font-weight="600" fill="#3a1d70" class="mono">/var/lib/flatpak</text>
<text x="402" y="77" font-size="9" font-weight="700" fill="#1a1209"><tspan class="mono" fill="#6d28d9">--system</tspan> (default): every user, needs sudo</text>
<rect x="272.5" y="112.5" width="264" height="72" rx="7" fill="#1a1209"/><rect x="270" y="110" width="264" height="72" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
<text x="402" y="130" font-size="12" font-weight="800" fill="#1a1209">User installation</text>
<text x="402" y="146" font-size="9" font-weight="600" fill="#5c4a30" class="mono">~/.local/share/flatpak</text>
<text x="402" y="167" font-size="9" font-weight="700" fill="#1a1209"><tspan class="mono" fill="#6d28d9">--user</tspan>: only that user, no sudo</text>
<rect x="608.5" y="46.5" width="144" height="112" rx="7" fill="#1a1209"/><rect x="606" y="44" width="144" height="112" rx="7" fill="#6d28d9" stroke="#1a1209" stroke-width="2"/>
<text x="678" y="72" font-size="12" font-weight="800" fill="#fff" class="mono">flatpak run</text>
<rect x="620" y="84" width="116" height="22" rx="5" fill="#fffae0" stroke="#1a1209" stroke-width="1.5"/>
<text x="678" y="99" font-size="9" font-weight="700" fill="#1a1209">app</text>
<rect x="620" y="110" width="116" height="22" rx="5" fill="#efe6ff" stroke="#1a1209" stroke-width="1.5"/>
<text x="678" y="125" font-size="9" font-weight="700" fill="#1a1209">runtime it needs</text>
<text x="678" y="148" font-size="9" font-weight="700" fill="#efe6ff">in a sandbox</text>
</g>
<path d="M176 24V178" fill="none" stroke="#1a1209" stroke-width="1.5"/>
<path d="M264 24V178" fill="none" stroke="#1a1209" stroke-width="1.5"/>
<text x="220" y="90" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1a1209" class="mono">flatpak</text>
<text x="220" y="102" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1a1209" class="mono">install</text>
<g stroke="#1a1209" stroke-width="2" fill="none" marker-end="url(#fp)">
<path d="M178 112H262"/>
<path d="M536 56L604 82"/>
<path d="M536 146L604 120"/>
</g>
</svg>
