<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LVM layers: two disks each hold one partition; pvcreate makes each partition a physical volume; the volume group pools their 8 MiB extents; logical volumes take extents from the pool, even across disks; file systems go on the logical volumes">
