<text x="260" y="42" font-size="10.5" font-weight="800" fill="#1a1209" class="mono">read -r user group</text>
<text x="260" y="58" font-size="9" font-weight="700" fill="#1a1209">takes the next line</text>
<rect x="174.5" y="106.5" width="176" height="46" rx="7" fill="#1a1209"/><rect x="172" y="104" width="176" height="46" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
<text x="260" y="123" font-size="11" font-weight="800" fill="#1a1209">loop body</text>
