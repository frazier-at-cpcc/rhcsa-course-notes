<svg viewBox="0 0 360 346" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The kernel checks root first, then owner, then group, then other, and uses only the first set of bits that matches">
  <defs>
    <marker id="pc-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1a1209"/></marker>
    <marker id="pc-pur" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6d28d9"/></marker>
  </defs>
  <!-- question boxes -->
  <g>
    <rect x="15" y="15" width="196" height="46" rx="7" fill="#1a1209"/>
    <rect x="12" y="12" width="196" height="46" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
    <rect x="15" y="89" width="196" height="46" rx="7" fill="#1a1209"/>
    <rect x="12" y="86" width="196" height="46" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
    <rect x="15" y="163" width="196" height="46" rx="7" fill="#1a1209"/>
    <rect x="12" y="160" width="196" height="46" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
    <rect x="15" y="237" width="196" height="40" rx="7" fill="#1a1209"/>
    <rect x="12" y="234" width="196" height="40" rx="7" fill="#efe6ff" stroke="#1a1209" stroke-width="2"/>
  </g>
  <g font-size="11" font-weight="700" fill="#1a1209" text-anchor="middle">
    <text x="110" y="32">Is the process running</text>
    <text x="110" y="48">as root (UID 0)?</text>
    <text x="110" y="106">Is your UID the</text>
    <text x="110" y="122">file's owner?</text>
    <text x="110" y="180">Is the file's group one</text>
    <text x="110" y="196">of your groups?</text>
    <text x="110" y="258">Use the other (o) bits</text>
  </g>
  <!-- result boxes -->
  <g>
    <rect x="247" y="17" width="94" height="42" rx="7" fill="#1a1209"/>
    <rect x="244" y="14" width="94" height="42" rx="7" fill="#fffae0" stroke="#1a1209" stroke-width="2"/>
    <rect x="247" y="91" width="94" height="42" rx="7" fill="#1a1209"/>
    <rect x="244" y="88" width="94" height="42" rx="7" fill="#efe6ff" stroke="#1a1209" stroke-width="2"/>
    <rect x="247" y="165" width="94" height="42" rx="7" fill="#1a1209"/>
    <rect x="244" y="162" width="94" height="42" rx="7" fill="#efe6ff" stroke="#1a1209" stroke-width="2"/>
  </g>
  <g font-size="11" font-weight="700" fill="#1a1209" text-anchor="middle">
    <text x="291" y="32">Allowed</text>
    <text x="291" y="113">Use the</text>
    <text x="291" y="187">Use the</text>
  </g>
  <g font-size="9.5" font-weight="600" fill="#5c4a30" text-anchor="middle">
    <text x="291" y="47">(run: any x bit)</text>
    <text x="291" y="124">owner (u) bits</text>
    <text x="291" y="198">group (g) bits</text>
  </g>
  <!-- yes arrows -->
  <g stroke="#1a1209" stroke-width="2" fill="none" marker-end="url(#pc-ink)">
    <path d="M210 35H238"/>
    <path d="M210 109H238"/>
    <path d="M210 183H238"/>
  </g>
  <g font-size="9.5" font-weight="800" fill="#1a1209" text-anchor="middle">
    <text x="225" y="29">yes</text>
    <text x="225" y="103">yes</text>
    <text x="225" y="177">yes</text>
  </g>
  <!-- no arrows -->
  <g stroke="#1a1209" stroke-width="2" fill="none" marker-end="url(#pc-ink)">
    <path d="M110 60V80"/>
    <path d="M110 134V154"/>
    <path d="M110 208V228"/>
  </g>
  <g font-size="9.5" font-weight="800" fill="#1a1209">
    <text x="117" y="75">no</text>
    <text x="117" y="149">no</text>
    <text x="117" y="223">no</text>
  </g>
  <!-- the chosen bits feed one final test -->
  <g stroke="#6d28d9" stroke-width="2" fill="none" marker-end="url(#pc-pur)">
    <path d="M338 109H344V292"/>
    <path d="M291 205V292"/>
    <path d="M110 276V292"/>
  </g>
  <rect x="15" y="303" width="338" height="38" rx="7" fill="#1a1209"/>
  <rect x="12" y="300" width="338" height="38" rx="7" fill="#6d28d9" stroke="#1a1209" stroke-width="2"/>
  <text x="181" y="316" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">Is the needed r, w, or x bit set in that one set?</text>
  <text x="181" y="331" text-anchor="middle" font-size="9.5" font-weight="600" fill="#efe6ff">yes: allowed. no: Permission denied, with no fallback</text>
</svg>
