name: Command tests

# Runs every test script in tests/ against the commands shown in the notes.
# The full-system topics are captured separately with lab/run.sh on a RHEL 10
# VM (see lab/README.md).
# Manual only: start it from the Actions tab before a release or after a tool
# update. It does not gate the PDF build.
on:
  workflow_dispatch:
    inputs:
      pattern:
        description: 'Tests to run (glob under tests/)'
        default: '*.sh'
        required: false

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run the selected tests
        env:
          PATTERN: ${{ inputs.pattern }}
        run: |
          fail=0
          for t in tests/${PATTERN:-*.sh}; do
            echo "::group::$t"
            start=$(date +%s)
            # Tests reproduce what a student sees in a terminal; hide the CI
            # markers that make tools switch output format.
            if env -u CI -u GITHUB_ACTIONS -u GITHUB_WORKFLOW bash "$t"; then echo "PASS $t ($(( $(date +%s) - start ))s)"; else echo "::error::$t failed"; fail=1; fi
            echo "::endgroup::"
          done
          exit $fail
